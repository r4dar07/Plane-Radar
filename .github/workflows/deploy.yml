name: Deploy SkyScope to GitHub Pages

on:
  push:
    branches: [ "main" ] # Change to "master" if your default branch uses that name

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Project with Nitro Target
        run: npm run build
        env:
          NITRO_PRESET: github-pages

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Build Output Directory
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.output/public' # TanStack Start / Nitro static folder path

      - name: Deploy to GitHub Pages Live Server
        id: deployment
        uses: actions/deploy-pages@v4
